<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page Agent 本地练习页</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#242139;background:#f5f6fa;font:15px/1.65 system-ui,sans-serif}main{max-width:900px;margin:48px auto;padding:0 24px}header p{color:#656078}.tag{color:#6150bd;font-size:12px;font-weight:700;letter-spacing:.08em}h1{font-size:32px;line-height:1.3}section{margin:24px 0;padding:24px;border:1px solid #e0ddea;border-radius:14px;background:white}h2{margin-top:0;font-size:20px}label{display:block;font-weight:600}input{max-width:100%;padding:10px 12px;border:1px solid #c8c2db;border-radius:7px;font:inherit}button{margin:10px 8px 10px 0;padding:10px 16px;border:0;border-radius:7px;color:white;background:#6653ce;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #aa9ee8;outline-offset:3px}output{display:block;min-height:28px;margin-top:12px;color:#2b735c}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #ebe9f2}small{color:#746e84}a{color:#5843b8}
  </style>
</head>
<body><main>
  <header><span class="tag">PAGE AGENT · PRACTICE</span><h1>本地工作流练习</h1><p>此页只在浏览器内展示演示数据，不提交订单、发送邮件或上传文件。</p><a href="../user-manual.html">打开使用手册</a></header>
  <section aria-labelledby="greeting-title"><h2 id="greeting-title">01 / 填写与点击</h2><label for="name">姓名</label><input id="name" name="姓名" placeholder="例如：张三" autocomplete="off"><button type="button" id="greet">显示问候</button><output id="result" aria-live="polite"></output><small>练习 Selector：#name → #greet → #result</small></section>
  <section aria-labelledby="dialog-title"><h2 id="dialog-title">02 / 原生弹窗</h2><button type="button" id="confirm-button">确认练习</button><button type="button" id="prompt-button">输入备注</button><output id="dialog-result" aria-live="polite"></output></section>
  <section aria-labelledby="file-title"><h2 id="file-title">03 / 选入文件</h2><label for="upload-file">选择本机文件</label><input type="file" id="upload-file" name="文件" multiple><output id="file-result" aria-live="polite"></output><small>仅显示文件信息，不向服务器发送文件。</small></section>
  <section aria-labelledby="table-title"><h2 id="table-title">04 / 读取数据表</h2><table id="records"><thead><tr><th>编号</th><th>姓名</th><th>金额</th></tr></thead><tbody><tr><td>001</td><td>张三</td><td>100.50</td></tr><tr><td>002</td><td>李四</td><td>200</td></tr></tbody></table></section>
  <script>
    document.getElementById('greet').addEventListener('click', () => { document.getElementById('result').textContent = '你好，' + (document.getElementById('name').value || '访客'); });
    document.getElementById('confirm-button').addEventListener('click', () => { document.getElementById('dialog-result').textContent = confirm('确认继续练习？') ? '已确定' : '已取消'; });
    document.getElementById('prompt-button').addEventListener('click', () => { const text = prompt('请输入练习备注', ''); document.getElementById('dialog-result').textContent = text === null ? '已取消输入' : '备注：' + text; });
    document.getElementById('upload-file').addEventListener('change', event => { document.getElementById('file-result').textContent = [...event.target.files].map(file => file.name + '（' + file.size + ' 字节）').join('、'); });
  </script>
</main></body></html>
