name: Cross-platform build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp-server
      - run: npm run mcp:build
      - run: npm run mcp:config
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Validate generated user handbook
        if: runner.os == 'Linux'
        run: |
          npm run docs:build
          npm run docs:check
          git diff --exit-code -- docs/user-manual.html docs/customer-portable-guide.html docs/manual-build.json
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
