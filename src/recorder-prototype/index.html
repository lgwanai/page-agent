<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>Page Agent 最小录制验证</title></head><body style="font:16px system-ui;max-width:900px;margin:40px auto;background:#10151e;color:#e6edf7"><h1>网页录制验证</h1><p>先在直播网页点击工具栏的 Page Agent 图标，再选择对应标签页开始。录制过程中可以关闭此页，文件将自动保存到下载目录的 PageAgent 文件夹。</p><p>已加载版本 <strong id="version"></strong></p><label>目标标签页 <select id="tab"></select></label> <button id="refresh">刷新标签页</button><p><label>时长（秒） <input id="duration" type="number" value="60" min="1" max="1800"></label> <label>模式 <select id="mode"><option value="videoAudio">画面和网页声音</option><option value="audio">仅网页声音</option></select></label></p><button id="start">开始录制</button> <button id="stop">停止并保存</button><pre id="status" style="white-space:pre-wrap"></pre><script type="module" src="./index.ts"></script></body></html>
